<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verifikasi Fakta & Pelacak Hoaks</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --border-color: #334155;
      --warning-bg: rgba(245, 158, 11, 0.1);
      --warning-border: #f59e0b;
      --warning-text: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    header { width: 100%; border-bottom: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 50; }
    .nav-container { max-width: 1100px; margin: 0 auto; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.15rem; font-weight: 700; color: var(--text-main); }
    .brand span { color: var(--primary); }
    .dev-badge { display: inline-flex; align-items: center; gap: 8px; background: #1e293b; padding: 6px 14px; border-radius: 9999px; border: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-muted); }
    .pulse-dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    main { flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 40px 20px; }
    .hero { text-align: center; margin-bottom: 35px; }
    .hero h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; }
    .hero p { color: var(--text-muted); }
    .search-panel { background: var(--card-bg); border: 1px solid var(--border-color); padding: 24px; border-radius: 16px; max-width: 750px; margin: 0 auto 30px auto; }
    .form-grid { display: flex; flex-direction: column; gap: 14px; }
    input { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-main); padding: 14px 16px; border-radius: 8px; font-size: 1rem; outline: none; }
    button { background: var(--primary); color: #0f172a; font-weight: 700; border: none; padding: 14px 20px; border-radius: 8px; cursor: pointer; }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .fact-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
    .warning-card { background: var(--warning-bg); border: 1px solid var(--warning-border); border-radius: 14px; padding: 24px; margin: 0 auto; }
    .warning-title { font-size: 1.15rem; font-weight: 700; color: var(--warning-text); margin-bottom: 12px; }
    .warning-desc { font-size: 0.95rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 20px; }
    .action-btn { display: inline-block; padding: 10px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-decoration: none; background: #f59e0b; color: #0f172a; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand">Fact<span>Check</span> ID</div>
      <div class="dev-badge"><span class="pulse-dot"></span><span>developer : fatur62</span></div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Lacak Berita & Verifikasi Klaim</h1>
      <p>Verifikasi kredibilitas informasi dari rujukan ensiklopedia publik.</p>
    </section>

    <section class="search-panel">
      <form id="claim-form" class="form-grid">
        <input type="text" id="query-input" placeholder="Masukkan judul klaim..." required />
        <button type="submit">Cek Fakta Sekarang</button>
      </form>
    </section>

    <div id="results-container" class="results-grid"></div>
  </main>

  <script>
    const claimForm = document.getElementById('claim-form');
    const queryInput = document.getElementById('query-input');
    const resultsContainer = document.getElementById('results-container');

    claimForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = queryInput.value.trim();
      if (!query) return;

      resultsContainer.innerHTML = '<p style="text-align:center;">Mencari rujukan untuk: "' + query + '"...</p>';

      try {
        const response = await fetch(`https://id.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`);
        const data = await response.json();
        const results = data?.query?.search || [];

        resultsContainer.innerHTML = '';

        if (results.length === 0) {
          const warning = document.createElement('div');
          warning.style.gridColumn = '1 / -1';
          warning.innerHTML = `
            <div class="warning-card">
              <div class="warning-title">⚠️ Judul "${query}" Tidak Ditemukan</div>
              <p class="warning-desc">
                Kami telah memindai basis data ensiklopedia publik namun <strong>tidak menemukan catatan kredibel</strong> mengenai <strong>"${query}"</strong>. 
                Hal ini mengindikasikan bahwa judul tersebut mungkin bukan fakta, rumor, atau berita yang belum terverifikasi secara resmi. Harap berhati-hati sebelum membagikan informasi ini.
              </p>
              <a href="https://turnbackhoax.id/?s=${encodeURIComponent(query)}" target="_blank" class="action-btn">Cek di TurnBackHoax.ID →</a>
            </div>
          `;
          resultsContainer.appendChild(warning);
        } else {
          results.forEach(item => {
            const card = document.createElement('div');
            card.className = 'fact-card';
            card.innerHTML = `<h3>${item.title}</h3><p style="margin:10px 0; color:#94a3b8; font-size:0.9rem;">${item.snippet.replace(/<\/?[^>]+(>|$)/g, "")}...</p><a href="https://id.wikipedia.org/?curid=${item.pageid}" target="_blank" style="color:#38bdf8;">Baca selengkapnya →</a>`;
            resultsContainer.appendChild(card);
          });
        }
      } catch (err) {
        resultsContainer.innerHTML = '<p style="text-align:center; color:red;">Gagal terhubung ke server.</p>';
      }
    });
  </script>
</body>
</html>
